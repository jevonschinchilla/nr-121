<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Revision">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000000">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Nebius Revision</title>
<style>
:root {
  --bg: #ffffff; --fg: #000000; --muted: #565b64; --line: #c6c9d0; --surface: #f1f2f4; --surface2: #e6e8ec;
  --accent: #1a3f9a; --accent-fg: #ffffff;
  --ok: #0a6b3a; --ok-bg: #e2f3e9; --bad: #b3261e; --bad-bg: #fbe7e5;
  --amber: #7a4a00; --amber-bg: #fff1cc; --red: #b3261e; --green: #0a6b3a;
  --tap: rgba(0,0,0,0.06);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #000000; --fg: #ffffff; --muted: #a9adb6; --line: #3d4149; --surface: #131418; --surface2: #202229;
    --accent: #9fb7ff; --accent-fg: #000000;
    --ok: #5ad48d; --ok-bg: #0f2a1b; --bad: #ff8577; --bad-bg: #3b1512;
    --amber: #f6c04a; --amber-bg: #3a2a08; --red: #ff8577; --green: #5ad48d;
    --tap: rgba(255,255,255,0.10);
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { height: 100%; -webkit-text-size-adjust: 100%; }
body {
  margin: 0; min-height: 100%; background: var(--bg); color: var(--fg);
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  font-size: 17px; line-height: 1.45; touch-action: manipulation; overscroll-behavior-y: none;
}
#app { max-width: 720px; margin: 0 auto; padding: calc(12px + env(safe-area-inset-top)) 16px calc(88px + env(safe-area-inset-bottom)); }
h1 { font-size: 26px; line-height: 1.2; margin: 6px 0 4px; letter-spacing: -0.01em; }
h2 { font-size: 20px; line-height: 1.25; margin: 22px 0 8px; }
h3 { font-size: 17px; margin: 18px 0 6px; }
p { margin: 8px 0; }
small, .muted { color: var(--muted); }
.num { font-variant-numeric: tabular-nums; }
button, input, textarea, select { font: inherit; color: inherit; }
button { touch-action: manipulation; cursor: pointer; }
button:focus-visible, .opt:focus-visible, .chip:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.spread { justify-content: space-between; }
.stack > * + * { margin-top: 10px; }

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; min-height: 48px; min-width: 44px; padding: 10px 18px; border: 1.5px solid var(--fg); border-radius: 12px; background: var(--bg); color: var(--fg); font-weight: 600; text-align: center; }
.btn:active { background: var(--tap); }
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.btn.quiet { border-color: var(--line); font-weight: 500; }
.btn.danger { border-color: var(--bad); color: var(--bad); }
.btn.wide { width: 100%; }
.btn:disabled { opacity: 0.4; cursor: default; }
.btn.small { min-height: 44px; padding: 6px 12px; font-size: 15px; }

/* Mode list (home) */
.mode { display: flex; align-items: center; justify-content: space-between; width: 100%; min-height: 60px; padding: 10px 14px; margin: 0 0 8px; border: 1.5px solid var(--line); border-radius: 12px; background: var(--bg); color: var(--fg); text-align: left; }
.mode:active:not(:disabled) { background: var(--tap); }
.mode:disabled { opacity: 0.45; }
.mode .name { font-weight: 600; }
.mode .meta { font-size: 14px; color: var(--muted); display: block; }
.mode .weakcount { font-size: 14px; color: var(--bad); font-weight: 600; white-space: nowrap; margin-left: 10px; }
.mode.session-of { border-color: var(--accent); }

/* Badges */
.badge { display: inline-block; font-size: 13px; font-weight: 600; padding: 3px 9px; border-radius: 8px; border: 1.5px solid var(--line); color: var(--fg); background: var(--surface); }
.badge.type { border-color: var(--accent); color: var(--accent); background: transparent; }
.badge.pri-red { background: var(--bad-bg); border-color: var(--red); color: var(--red); }
.badge.pri-amber { background: var(--amber-bg); border-color: var(--amber); color: var(--amber); }
.badge.pri-green { background: var(--ok-bg); border-color: var(--green); color: var(--green); }
.badge.ts { background: var(--amber-bg); border-color: var(--amber); color: var(--amber); }

/* Session */
.topbar { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 4px 0 10px; border-bottom: 1.5px solid var(--line); margin-bottom: 14px; }
.topbar .progress { font-weight: 700; }
.stem { font-size: 21px; line-height: 1.35; font-weight: 600; margin: 14px 0 16px; }
.statement { font-size: 19px; line-height: 1.4; padding: 12px 14px; border-left: 4px solid var(--accent); background: var(--surface); border-radius: 0 10px 10px 0; margin: 0 0 16px; }
.opt { display: flex; align-items: flex-start; gap: 12px; width: 100%; min-height: 52px; padding: 12px 14px; margin: 0 0 8px; border: 1.5px solid var(--line); border-radius: 12px; background: var(--bg); color: var(--fg); text-align: left; line-height: 1.35; }
.opt .k { flex: 0 0 26px; height: 26px; border-radius: 7px; border: 1.5px solid var(--line); display: inline-flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; color: var(--muted); margin-top: 1px; }
.opt.sel { border-color: var(--accent); box-shadow: inset 0 0 0 1.5px var(--accent); }
.opt.sel .k { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.opt.right { border-color: var(--ok); background: var(--ok-bg); }
.opt.wrong { border-color: var(--bad); background: var(--bad-bg); }
.opt.missed { border-style: dashed; border-color: var(--ok); }
.opt:active { background: var(--tap); }
input.answer, textarea.answer { width: 100%; font-size: 18px; padding: 12px 14px; min-height: 52px; border: 1.5px solid var(--line); border-radius: 12px; background: var(--bg); color: var(--fg); }
textarea.answer { min-height: 96px; resize: vertical; line-height: 1.4; }
.unit { font-weight: 600; white-space: nowrap; }
.actionbar { display: flex; gap: 10px; margin-top: 18px; }
.actionbar .btn { flex: 1; }

/* Chips (sequence, slot, match) */
.tray { display: flex; flex-wrap: wrap; gap: 8px; padding: 10px; min-height: 64px; border: 1.5px dashed var(--line); border-radius: 12px; margin: 8px 0 12px; }
.chip { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 8px 14px; border: 1.5px solid var(--fg); border-radius: 22px; background: var(--bg); color: var(--fg); text-align: left; line-height: 1.3; }
.chip .k { font-size: 12px; font-weight: 700; color: var(--muted); }
.chip.sel { border-color: var(--accent); box-shadow: inset 0 0 0 1.5px var(--accent); }
.chip:active { background: var(--tap); }
.ordered { list-style: none; margin: 0; padding: 0; }
.ordered li { margin: 0 0 8px; }
.ordered .chip { width: 100%; border-radius: 12px; justify-content: flex-start; }
.ordered .chip .n { flex: 0 0 26px; font-weight: 700; color: var(--accent); }
.ordered .chip.right { border-color: var(--ok); background: var(--ok-bg); }
.ordered .chip.wrong { border-color: var(--bad); background: var(--bad-bg); }
.ordered .chip.div { box-shadow: inset 0 0 0 2px var(--bad); }

/* Slot diagram */
.diagram { display: flex; gap: 6px; margin: 8px 0 14px; }
.diagram.stack { flex-direction: column; align-items: stretch; }
.diagram.flow { flex-direction: row; flex-wrap: wrap; align-items: center; }
.node { min-height: 48px; padding: 10px 12px; border: 1.5px solid var(--fg); border-radius: 10px; background: var(--surface); line-height: 1.3; display: flex; align-items: center; justify-content: center; text-align: center; }
.diagram.flow .node { flex: 1 1 140px; }
.node.blank { border-style: dashed; border-color: var(--accent); color: var(--accent); background: transparent; font-weight: 600; cursor: pointer; }
.node.blank.active { box-shadow: inset 0 0 0 2px var(--accent); background: var(--surface); }
.node.blank.filled { border-style: solid; color: var(--fg); }
.node.right { border-color: var(--ok); background: var(--ok-bg); }
.node.wrong { border-color: var(--bad); background: var(--bad-bg); }
.arrow { text-align: center; color: var(--muted); font-size: 18px; line-height: 1; flex: 0 0 auto; }
.diagram.stack .arrow { padding: 0; }

/* Match */
.cols { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 8px 0; }
.cols .chip { width: 100%; border-radius: 12px; justify-content: flex-start; }
.pairs .chip { width: 100%; border-radius: 12px; justify-content: flex-start; margin-bottom: 8px; }
.pairs .chip.right { border-color: var(--ok); background: var(--ok-bg); }
.pairs .chip.wrong { border-color: var(--bad); background: var(--bad-bg); }

/* Feedback */
.verdict { font-size: 22px; font-weight: 700; padding: 12px 14px; border-radius: 12px; margin: 6px 0 14px; }
.verdict.ok { background: var(--ok-bg); color: var(--ok); }
.verdict.bad { background: var(--bad-bg); color: var(--bad); }
.verdict.over { background: var(--amber-bg); color: var(--amber); }
.fb-block { padding: 12px 14px; border: 1.5px solid var(--line); border-radius: 12px; margin: 0 0 10px; }
.fb-block .lbl { font-size: 13px; color: var(--muted); font-weight: 600; margin-bottom: 4px; }
.conc { display: inline-block; padding: 3px 9px; border-radius: 8px; margin: 2px 6px 2px 0; font-size: 14px; border: 1.5px solid var(--line); }
.conc.hit { border-color: var(--ok); color: var(--ok); background: var(--ok-bg); }
.conc.miss { border-color: var(--bad); color: var(--bad); background: var(--bad-bg); }
.secondary { display: flex; gap: 10px; margin-top: 12px; }
.secondary .btn { flex: 1; }

/* Tables */
table { width: 100%; border-collapse: collapse; font-size: 15px; }
th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 13px; color: var(--muted); font-weight: 600; }
td.num, th.num { text-align: right; }
.mark { font-size: 12px; color: var(--amber); font-weight: 700; }

/* Summary */
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 10px 0 16px; }
.stat { padding: 10px 12px; border: 1.5px solid var(--line); border-radius: 12px; }
.stat .v { font-size: 24px; font-weight: 700; line-height: 1.1; }
.stat .l { font-size: 13px; color: var(--muted); }
.list-item { width: 100%; text-align: left; padding: 10px 12px; border: 1.5px solid var(--line); border-radius: 12px; background: var(--bg); color: var(--fg); margin: 0 0 8px; min-height: 48px; }
.list-item:active { background: var(--tap); }

/* Weak spots */
.weak-entry { padding: 12px 0; border-bottom: 1px solid var(--line); }
.weak-entry .hist { letter-spacing: 2px; font-weight: 700; }
.tick { color: var(--ok); } .cross { color: var(--bad); }

/* Progress */
.chart { width: 100%; height: auto; display: block; margin: 6px 0 10px; }
.bar { height: 12px; background: var(--surface2); border-radius: 6px; overflow: hidden; margin: 4px 0 8px; }
.bar > div { height: 100%; background: var(--accent); }
.bar.mast > div { background: var(--ok); }

/* Settings */
.field { margin: 10px 0 14px; }
.field label { display: block; font-weight: 600; margin-bottom: 6px; }
.seg { display: inline-flex; border: 1.5px solid var(--fg); border-radius: 12px; overflow: hidden; }
.seg button { min-height: 44px; min-width: 64px; padding: 8px 16px; background: var(--bg); color: var(--fg); border: 0; border-right: 1.5px solid var(--fg); font-weight: 600; }
.seg button:last-child { border-right: 0; }
.seg button.on { background: var(--accent); color: var(--accent-fg); }
.toggle { display: flex; align-items: center; justify-content: space-between; min-height: 48px; }
.switch { width: 56px; height: 32px; border-radius: 16px; border: 1.5px solid var(--fg); background: var(--bg); position: relative; padding: 0; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 12px; background: var(--fg); transition: left .15s; }
.switch.on { background: var(--accent); border-color: var(--accent); }
.switch.on::after { left: 27px; background: var(--accent-fg); }
@media (prefers-reduced-motion: reduce) { .switch::after { transition: none; } }
.issue { padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 15px; }
.issue code { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 14px; }
pre.export { white-space: pre-wrap; word-break: break-all; font-size: 13px; padding: 10px; border: 1.5px solid var(--line); border-radius: 10px; max-height: 240px; overflow: auto; }
.banner { padding: 12px 14px; border: 1.5px solid var(--accent); border-radius: 12px; margin: 12px 0; }

/* Tab bar */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; background: var(--bg); border-top: 1.5px solid var(--line); padding-bottom: env(safe-area-inset-bottom); z-index: 5; }
.tabs .inner { max-width: 720px; margin: 0 auto; display: flex; }
.tabs button { flex: 1; min-height: 56px; background: transparent; border: 0; border-top: 3px solid transparent; color: var(--muted); font-size: 14px; font-weight: 600; padding: 8px 2px; }
.tabs button.on { color: var(--accent); border-top-color: var(--accent); }
.tabs button:active { background: var(--tap); }
body.in-session .tabs { display: none; }
body.in-session #app { padding-bottom: calc(24px + env(safe-area-inset-bottom)); }

/* Toast and modal */
#toast { position: fixed; left: 50%; bottom: calc(76px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-weight: 600; opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 9; max-width: 90vw; }
#toast.show { opacity: 1; }
.modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.55); display: flex; align-items: flex-end; justify-content: center; z-index: 8; }
.modal { background: var(--bg); color: var(--fg); width: 100%; max-width: 720px; border-radius: 16px 16px 0 0; padding: 18px 16px calc(18px + env(safe-area-inset-bottom)); }
.hidden { display: none !important; }
.screen { display: none; }
.screen.active { display: block; }
.version { font-size: 13px; color: var(--muted); margin-top: 18px; }
hr { border: 0; border-top: 1.5px solid var(--line); margin: 16px 0; }
</style>
</head>

<script>
(function () {
'use strict';
var APP_VERSION = '1.0.1';
var STORAGE_KEY = 'nbis.progress.v1';
var MODULE_FALLBACK = { 11: 'Excel capstone' };
var TYPE_LABEL = { mcq: 'Multiple choice', recall: 'Recall', define: 'Define', numeric: 'Numeric', sequence: 'Sequence', slot: 'Complete the diagram', match: 'Match', classify: 'Classify' };
var TAB_DEFS = [['home', 'Home'], ['weak', 'Weak Spots'], ['boards', 'Boards'], ['progress', 'Progress'], ['settings', 'Settings']];

/* ---------- DOM helpers ---------- */
function h(tag, attrs) {
  var el = document.createElement(tag);
  if (attrs) Object.keys(attrs).forEach(function (k) {
    var v = attrs[k];
    if (k === 'class') el.className = v;
    else if (k === 'text') el.textContent = v;
    else if (k === 'html') el.innerHTML = v;
    else if (k.slice(0, 2) === 'on') el.addEventListener(k.slice(2), v);
    else if (k === 'style') el.style.cssText = v;
    else if (v !== null && v !== undefined && v !== false) el.setAttribute(k, v === true ? '' : v);
  });
  for (var i = 2; i < arguments.length; i++) append(el, arguments[i]);
  return el;
}
function append(el, c) {
  if (c === null || c === undefined || c === false) return;
  if (Array.isArray(c)) { c.forEach(function (x) { append(el, x); }); return; }
  el.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
}
function clear(el) { while (el.firstChild) el.removeChild(el.firstChild); }
var app = document.getElementById('app');
var toastTimer = null;
function toast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.classList.remove('show'); }, 2200);
}
function modal(title, bodyNodes, buttons) {
  var root = document.getElementById('modal-root');
  clear(root);
  var box = h('div', { class: 'modal', role: 'dialog', 'aria-modal': 'true' }, h('h2', { text: title, style: 'margin-top:0' }), bodyNodes,
    h('div', { class: 'actionbar' }, buttons.map(function (b) {
      return h('button', { class: 'btn ' + (b.cls || ''), text: b.label, onclick: function () { if (b.onclick && b.onclick() === false) return; closeModal(); } });
    })));
  var bg = h('div', { class: 'modal-bg', onclick: function (e) { if (e.target === bg) closeModal(); } }, box);
  root.appendChild(bg);
  return box;
}
function closeModal() { clear(document.getElementById('modal-root')); }
function fmtTime(ms) {
  var s = Math.round(ms / 1000); var m = Math.floor(s / 60); s = s % 60;
  return m + ':' + (s < 10 ? '0' : '') + s;
}
function fmtDate(iso) {
  var d = new Date(iso); if (isNaN(d)) return String(iso);
  return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
}
function pad(n) { return (n < 10 ? '0' : '') + n; }
function pct(a, b) { return b ? Math.round(1000 * a / b) / 10 : 0; }
function uid(prefix) { return prefix + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 8); }

/* ---------- Persistence ---------- */
function defaultProgress() {
  return { schema_version: 1, profile: 'Hugo', settings: { session_length: 25, red_only: false, profiles: ['Hugo'] },
    attempts: [], runs: [], issues: [], in_progress_session: null };
}
function loadProgress() {
  var p = null;
  try { var raw = localStorage.getItem(STORAGE_KEY); if (raw) p = JSON.parse(raw); } catch (e) { p = null; }
  if (!p || typeof p !== 'object') p = defaultProgress();
  var d = defaultProgress();
  Object.keys(d).forEach(function (k) { if (p[k] === undefined) p[k] = d[k]; });
  p.settings = Object.assign({}, d.settings, p.settings || {});
  if (!Array.isArray(p.settings.profiles) || !p.settings.profiles.length) p.settings.profiles = [p.profile || 'Hugo'];
  if (p.settings.profiles.indexOf(p.profile) < 0) p.settings.profiles.push(p.profile);
  return p;
}
var progress = loadProgress();
var storageOk = true;
function saveProgress() {
  progress.in_progress_session = session;
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(progress)); }
  catch (e) { if (storageOk) { storageOk = false; toast('Storage is unavailable; progress will not persist.'); } }
}
if (navigator.storage && navigator.storage.persist) { try { navigator.storage.persist().catch(function () {}); } catch (e) {} }

/* ---------- Banks ---------- */
var banks = {};        /* module -> {bank, valid, glossary} */
var itemsById = {};
var bankIssues = [];
var glossaryEntries = [];
var glossaryItemsList = [];
function loadBanks() {
  var seen = {};
  (window.NBIS_BANKS || []).forEach(function (bank) {
    var r = NBIS.validateBank(bank, seen);
    var mod = (bank && Number.isInteger(bank.module)) ? bank.module : null;
    r.issues.forEach(function (is) { bankIssues.push({ bank: mod === null ? '?' : mod, id: is.id, message: is.message }); });
    if (mod === null) return;
    if (banks[mod]) { bankIssues.push({ bank: mod, id: 'bank', message: 'a second bank for this module was ignored' }); return; }
    banks[mod] = { bank: bank, valid: r.valid, glossary: r.glossary };
    r.valid.forEach(function (it) { itemsById[it.id] = it; });
  });
  glossaryEntries = NBIS.mergeGlossary(Object.keys(banks).map(function (m) { return { module: Number(m), glossary: banks[m].glossary }; }));
  glossaryItemsList = NBIS.glossaryItems(glossaryEntries);
  glossaryItemsList.forEach(function (it) { itemsById[it.id] = it; });
}
loadBanks();
function moduleOfMode(mode) { if (mode === 'seed') return 0; var m = /^m(\d\d)$/.exec(mode); return m ? Number(m[1]) : null; }
function modeLabel(mode) {
  if (mode === 'glossary') return 'Glossary';
  if (mode === 'mixture') return 'Mixture';
  if (mode === 'weak') return 'Weak Spots';
  var m = moduleOfMode(mode);
  if (m === 0) return 'Seed';
  if (m === null) return mode;
  var title = banks[m] ? banks[m].bank.module_title : (MODULE_FALLBACK[m] || '');
  return 'Module ' + m + (title ? ': ' + title : '');
}
function allBankItems() { var out = []; Object.keys(banks).forEach(function (m) { out = out.concat(banks[m].valid); }); return out; }
function poolFor(mode) {
  if (mode === 'glossary') return glossaryItemsList;
  if (mode === 'mixture') return allBankItems().concat(glossaryItemsList);
  if (mode === 'weak') return allBankItems().concat(glossaryItemsList);
  var m = moduleOfMode(mode);
  return (m !== null && banks[m]) ? banks[m].valid : [];
